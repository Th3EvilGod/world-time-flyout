name: Build Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/WorldTimeFlyout.exe dist/
          Copy-Item scripts/install.ps1 dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath WorldTimeFlyout-win-x64.zip -Force
          (Get-FileHash WorldTimeFlyout-win-x64.zip -Algorithm SHA256).Hash | Set-Content WorldTimeFlyout-win-x64.zip.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WorldTimeFlyout-Windows-x64
          path: |
            WorldTimeFlyout-win-x64.zip
            WorldTimeFlyout-win-x64.zip.sha256.txt
