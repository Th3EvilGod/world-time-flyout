name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version, e.g. 0.1.0 (from main) or 0.2.0-beta.1. Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      - name: Version
        id: ver
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          $v = '0.1.0'
          $release = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v'); $release = $env:GITHUB_REF_NAME }
          $asked = "$env:RELEASE_INPUT".Trim().TrimStart('v')
          if ($asked) {
            if ($asked -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Release version '$asked' is not like 1.2.3 or 1.2.3-beta.1" }
            if ($asked -notlike '*-*' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases (not pre-releases) are published from main only' }
            $v = $asked; $release = "v$asked"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "Version $v" + $(if ($release) { ", publishing $release" } else { '' })

      - name: Unit tests (time zones, DST, search, settings, formatting)
        run: dotnet test --project tests/WorldTime.Core.Tests -c Release

      - name: Unit tests (calendar geometry, recorded Windows 11 values)
        run: dotnet test --project tests/WorldTime.Shell.Tests -c Release

      - name: Publish (NativeAOT, self-contained, x64)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'.Split('-')[0]
          dotnet publish src/WorldTimeFlyout/WorldTimeFlyout.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.ver.outputs.version }} -p:AssemblyVersion=$v -p:FileVersion=$v `
            -o publish/WorldTimeFlyout
          Copy-Item README.md, THIRD-PARTY-NOTICES.md publish/WorldTimeFlyout/
          Remove-Item publish/WorldTimeFlyout/*.pdb -ErrorAction SilentlyContinue

      - name: Screenshots (rendered by the real app)
        shell: pwsh
        run: |
          $shots = "$pwd/screenshots"
          Get-ChildItem publish/WorldTimeFlyout | Sort-Object Length -Descending | Select-Object -First 25 Name, Length | Format-Table -AutoSize
          $p = Start-Process publish/WorldTimeFlyout/WorldTimeFlyout.exe `
            -ArgumentList '--screenshot', $shots, '--fixed-time', '2026-11-09T14:00:00Z', '--diag' -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process $p -Force; throw 'screenshot run timed out' }
          'exit code: 0x{0:X8}' -f $p.ExitCode
          $log = "$env:LOCALAPPDATA/WorldTimeFlyout/log.txt"
          if (Test-Path $log) { '--- app log ---'; Get-Content $log }
          '--- recent application errors ---'
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
            Select-Object -First 5 | ForEach-Object { $_.ProviderName; $_.Message; '' }
          if (-not (Test-Path "$shots/screenshots.txt")) { throw 'screenshot run did not finish' }
          Get-Content "$shots/screenshots.txt"
          Get-ChildItem $shots
          if (Select-String -Path "$shots/screenshots.txt" -Pattern 'FAILED') { throw 'screenshot run failed' }

      - name: Integration (real taskbar calendar on the runner)
        shell: powershell
        run: |
          ./tools/integration.ps1 -AppDir publish/WorldTimeFlyout -OutDir integration
          "### Integration on the runner's real taskbar calendar" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content integration/results.txt | ForEach-Object { "- $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Measure size, memory and idle CPU
        shell: pwsh
        run: |
          ./tools/measure.ps1 -AppDir publish/WorldTimeFlyout -OutFile metrics.md
          Get-Content metrics.md >> $env:GITHUB_STEP_SUMMARY

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $name = "WorldTimeFlyout-${{ steps.ver.outputs.version }}-win-x64"
          Compress-Archive -Path publish/WorldTimeFlyout/* -DestinationPath "$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip: $('{0:N1}' -f ((Get-Item "$name.zip").Length / 1MB)) MB  sha256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256
            metrics.md

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            integration/

      - name: Release notes
        shell: pwsh
        run: |
          $n = '${{ steps.pkg.outputs.name }}'
          $hash = (Get-Content "$n.zip.sha256").Split(' ')[0]
          $fence = '```'; $tick = '`'
          $notes = (Get-Content docs/RELEASE_NOTES.md -Raw).TrimEnd() +
            "`n`n**SHA-256** of ${tick}$n.zip${tick}:`n`n$fence`n$hash`n$fence`n"
          Set-Content release-notes.md $notes -Encoding utf8
          "### Release notes (as they would be published)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $notes | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        if: steps.ver.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $n = '${{ steps.pkg.outputs.name }}'
          $tag = '${{ steps.ver.outputs.release }}'
          # 1.2.3-beta style versions are pre-releases; plain 1.2.3 is the latest release.
          $kind = if ($tag -like '*-*') { '--prerelease' } else { '--latest' }
          # Creates the tag on the built commit when it does not exist yet (Run workflow).
          gh release create $tag "$n.zip" "$n.zip.sha256" metrics.md `
            $kind --target $env:GITHUB_SHA --title "World Time Flyout $tag" `
            --notes-file release-notes.md
